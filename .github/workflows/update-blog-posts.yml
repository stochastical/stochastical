name: Update blog posts

on:
  schedule:
    - cron: "0 7 * * *"  # 07:00 UTC daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Install nushell
        uses: hustcer/setup-nu@v3.25
        with:
          version: "0.113.1"

      - name: Update README
        run: nu update_posts.nu

      - name: Commit and push if changed
        run: |
          git config user.name "Yossi Frenkel"
          git config user.email "14257692+stochastical@users.noreply.github.com"
          git diff --quiet && exit 0
          git add README.md
          git commit -m "chore: update recent blog posts"
          git push
